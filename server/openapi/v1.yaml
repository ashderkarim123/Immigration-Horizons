openapi: 3.0.0
info:
  title: Immigration Horizons Staff API
  version: "1.0"
  description: Canonical JSON API for the Angular Enterprise UI.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /staff/session/login:
    post:
      summary: Authenticate employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Success
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          description: Invalid email or password
  /staff/session/logout:
    post:
      summary: Revoke session
      responses:
        '200':
          description: Success
  /staff/me:
    get:
      summary: Get current employee profile and capabilities
      responses:
        '200':
          description: Profile data
  /staff/account/initial-password:
    post:
      summary: Set initial permanent password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password: { type: string, minLength: 12 }
                confirmPassword: { type: string }
      responses:
        '200':
          description: Success
        '400':
          description: Validation error
  /staff/dashboard:
    get:
      summary: Get dashboard metrics
      responses:
        '200':
          description: Metrics data
  /staff/cases:
    get:
      summary: List cases with search and stage filters
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: stage
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated cases
  /staff/cases/{id}:
    get:
      summary: Get case details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Case details
        '404':
          description: Case not found or inaccessible
  /staff/cases/{caseId}/stage:
    patch:
      summary: Advance or update case stage
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: string }
      responses:
        '200':
          description: Updated case details
        '403':
          description: Permission denied
  /staff/cases/{caseId}/project-manager:
    patch:
      summary: Assign or change Project Manager for case
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employeeId: { type: string, nullable: true }
      responses:
        '200':
          description: Updated case details
  /staff/cases/{caseId}/members:
    post:
      summary: Add employee team member to case workspace
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: string }
                role: { type: string, default: contributor }
      responses:
        '200':
          description: Updated case details
  /staff/cases/{caseId}/members/{memberId}:
    delete:
      summary: Remove member from case workspace
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated case details
  /staff/cases/{caseId}/archive:
    post:
      summary: Archive case (non-destructive)
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated case details
  /staff/cases/{caseId}/client-updates:
    post:
      summary: Publish client update message for case portal
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Published update message document
  /staff/cases/{caseId}/member-options:
    get:
      summary: Get active employees selectable for team assignment
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Array of active employees
  /staff/clients:
    get:
      summary: List clients
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated clients
  /staff/clients/{id}:
    get:
      summary: Get client details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Client details
  /staff/tasks:
    get:
      summary: List assigned tasks
      parameters:
        - name: scope
          in: query
          schema: { type: string, default: mine }
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: due
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Paginated tasks
  /staff/tasks/{id}:
    get:
      summary: Get task details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task details
    patch:
      summary: Update task details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string }
                dueDate: { type: string, format: date-time, nullable: true }
                type: { type: string }
      responses:
        '200':
          description: Success
  /staff/tasks/{id}/status:
    patch:
      summary: Update task status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        '200':
          description: Success
  /staff/tasks/{id}/assignee:
    patch:
      summary: Update task assignee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee: { type: string, nullable: true }
      responses:
        '200':
          description: Success
  /staff/cases/{id}/tasks:
    get:
      summary: List tasks for a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of tasks
    post:
      summary: Create a case-native task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                type: { type: string }
                priority: { type: string }
                dueDate: { type: string, format: date-time, nullable: true }
                assignee: { type: string, nullable: true }
                description: { type: string }
      responses:
        '200':
          description: Success
  /staff/deadlines:
    get:
      summary: List deadlines (case target filing and task due dates)
      parameters:
        - name: due
          in: query
          schema: { type: string, default: all }
        - name: scope
          in: query
          schema: { type: string, default: mine }
      responses:
        '200':
          description: List of deadlines
  /staff/cases/{id}/evidence/provision:
    post:
      summary: Provision an evidence checklist from a template
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateKey]
              properties:
                templateKey: { type: string }
                version: { type: integer, nullable: true }
      responses:
        '200':
          description: Success
  /staff/cases/{id}/evidence:
    get:
      summary: Get case evidence summary and requirements
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Evidence summary and checklist
  /staff/cases/{id}/evidence/requirements:
    post:
      summary: Create a custom evidence requirement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                importance: { type: string }
                section: { type: string }
      responses:
        '200':
          description: Success
  /staff/evidence/requirements/{id}/status:
    patch:
      summary: Update requirement status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Success
  /staff/evidence/requirements/{id}/documents:
    post:
      summary: Link a document to a requirement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string }
      responses:
        '200':
          description: Success
  /staff/evidence/requirements/{reqId}/documents/{docId}:
    delete:
      summary: Unlink a document from a requirement
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string }
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
  /staff/cases/{caseId}/documents:
    get:
      summary: Get an authorized case document center
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Bounded document, category, request, member, and capability DTOs }
        '404': { description: Case is missing or inaccessible }
    post:
      summary: Upload an employee document to a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, categoryId]
              properties:
                file: { type: string, format: binary }
                categoryId: { type: string }
                documentRequestId: { type: string, nullable: true }
                displayName: { type: string, nullable: true }
      responses:
        '201': { description: Secure document and first-version metadata }
        '400': { description: Validation failed }
        '413': { description: File too large }
        '415': { description: Unsupported media type }
  /staff/documents/{documentId}:
    get:
      summary: Get authorized staff document detail and version metadata
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Document DTO with safe version and evidence references }
        '404': { description: Document is missing or inaccessible }
  /staff/documents/{documentId}/versions:
    post:
      summary: Upload an immutable replacement version
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                changeNote: { type: string, nullable: true }
      responses:
        '200': { description: Updated document and new version metadata }
        '409': { description: Concurrent replacement conflict }
  /staff/documents/{documentId}/review:
    patch:
      summary: Review a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, needs_replacement, rejected] }
                clientVisibleReviewComment: { type: string, nullable: true }
                internalReviewComment: { type: string, nullable: true }
      responses:
        '200': { description: Reviewed document metadata }
  /staff/documents/{documentId}/category:
    patch:
      summary: Move a document to an active category on the same case
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: string }
      responses:
        '200': { description: Updated document metadata }
  /staff/documents/{documentId}/archive:
    post:
      summary: Archive a document without deleting version history
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Archived document metadata }
  /staff/documents/{documentId}/download:
    get:
      summary: Stream the authorized current document version
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Binary download with private no-store headers, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /staff/documents/{documentId}/versions/{versionId}/download:
    get:
      summary: Stream an authorized historical document version
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Binary download with private no-store headers, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /staff/cases/{caseId}/document-categories/initialize:
    post:
      summary: Idempotently provision default case document categories
      parameters: [ { name: caseId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Provisioning result } }
  /staff/cases/{caseId}/document-categories:
    post:
      summary: Create a custom case document category
      parameters: [ { name: caseId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, visibility, allowedUploaderTypes]
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [client_visible, employees_only] }
                allowedUploaderTypes: { type: string, enum: [client, employee, both] }
                required: { type: boolean }
      responses: { '201': { description: Category metadata } }
  /staff/document-categories/{categoryId}:
    patch:
      summary: Update a case document category
      parameters: [ { name: categoryId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Category metadata } }
  /staff/document-categories/{categoryId}/disable:
    post:
      summary: Disable a document category
      parameters: [ { name: categoryId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Category metadata } }
  /staff/document-categories/{categoryId}/reactivate:
    post:
      summary: Reactivate a document category
      parameters: [ { name: categoryId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Category metadata } }
  /staff/cases/{caseId}/document-categories/reorder:
    post:
      summary: Reorder all active document categories for a case
      parameters: [ { name: caseId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedCategoryIds]
              properties:
                orderedCategoryIds: { type: array, items: { type: string } }
      responses: { '200': { description: Categories reordered } }
  /staff/cases/{caseId}/document-requests:
    post:
      summary: Create a document request for an eligible client workspace member
      parameters: [ { name: caseId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, requestedFromMemberId, title]
              properties:
                categoryId: { type: string }
                requestedFromMemberId: { type: string }
                title: { type: string }
                instructions: { type: string }
                dueDate: { type: string, format: date, nullable: true }
      responses: { '201': { description: Document request metadata } }
  /staff/document-requests/{requestId}:
    patch:
      summary: Update allowed document request metadata
      parameters: [ { name: requestId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Document request metadata } }
  /staff/document-requests/{requestId}/cancel:
    post:
      summary: Cancel a document request without deleting it
      parameters: [ { name: requestId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Document request metadata } }
