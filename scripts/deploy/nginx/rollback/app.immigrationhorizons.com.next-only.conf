# /etc/nginx/sites-available/app.immigrationhorizons.com
#
# Client portal + staff console. SAME upstream as the marketing site — one
# Next.js process serves both, separated by host in src/proxy.ts (ADR-008).
# The host header is therefore load-bearing: proxy_set_header Host $host is
# what makes the proxy route correctly, and changing it breaks the split.

server {
    listen 80;
    listen [::]:80;
    server_name app.immigrationhorizons.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # Document uploads. The 25M here must not be lower than the app's own
    # DOCUMENT_MAX_FILE_SIZE_BYTES, or nginx rejects a file the app would
    # have accepted and the client sees a bare 413 with no explanation.
    client_max_body_size 25M;

    # Defence in depth only — the app already sets these on every response
    # (proxy.ts). Duplicated here so a proxy misconfiguration cannot expose
    # an authenticated surface to a crawler.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
