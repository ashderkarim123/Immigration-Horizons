# /etc/nginx/snippets/ih-app-staff-routes.conf
#
# Release Gate 01 (ADR-024): the three routes that move app.immigrationhorizons.com
# from "everything is Next.js" to the strangler layout.
#
#   /api/v1/*   -> Express canonical staff API   (127.0.0.1:4000)
#   /staff/*    -> Angular case-management        (static files of the ACTIVE release)
#   everything else (/portal, /api/portal, /, ...) keeps going to Next.js (127.0.0.1:3000)
#
# This file is deliberately an INCLUDE, not a whole server block. The live app
# server block is edited by certbot (TLS, http->https redirect), so replacing the
# whole file would drop the certificate configuration. Enabling the cutover is
# ONE line inside the HTTPS `server { }` block, ahead of `location / { }`:
#
#     include /etc/nginx/snippets/ih-app-staff-routes.conf;
#
# and the routing rollback is removing that line (or restoring the backed-up file),
# `nginx -t`, reload. See docs/deployment/ANGULAR_STAFF_CUTOVER_RUNBOOK.md.
#
# Rules this file keeps on purpose:
#   * `expires` (not add_header) sets cache headers, so the server-level security
#     headers (X-Robots-Tag, X-Frame-Options, ...) are still inherited here.
#   * No permanent redirects anywhere: a cached 301/308 would outlive a rollback
#     (the Next app redirects /staff/ -> /staff, and a cached redirect back would loop).
#   * No CORS. The browser talks to /api/v1 on the app host itself (same origin).

# --- Canonical staff API (Express) ------------------------------------------------
# `proxy_pass` with NO URI part forwards the original path untouched: /api/v1/x -> /api/v1/x.
# Host and forwarding headers stay the real app host (the staff API's trusted-origin and
# secure-cookie logic read them).
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;   # secure document streaming
    proxy_buffering       off;
}

# --- Angular staff app (static) ---------------------------------------------------
# Files live in the release that `current` points at (deploy.sh puts them in
# static/staff/ INSIDE each release, so a symlink rollback rolls the UI back too).
# nginx follows the `current` symlink; the worker user needs read access (runbook §Step B).

# Exact /staff serves the app directly (no redirect — see the note above about caching).
location = /staff {
    root /srv/immigration-horizons/current/static;
    try_files /staff/index.html =404;
    expires -1;
}

# Real files only: a missing hashed bundle is a 404, NOT index.html, so a bad deploy is
# visible instead of hiding behind the SPA fallback.
location ~ ^/staff/.+\.(?:js|mjs|css|map|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|txt|json|webmanifest)$ {
    root /srv/immigration-horizons/current/static;
    try_files $uri =404;
    expires 1y;               # filenames are content-hashed (outputHashing: all)
}

# Everything else under /staff/ is an Angular route: refresh/deep-link falls back to the
# shell of the active release. The shell is never cached so a new release is picked up.
location /staff/ {
    root /srv/immigration-horizons/current/static;
    try_files $uri /staff/index.html;
    expires -1;
}
