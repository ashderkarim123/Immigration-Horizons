# /etc/nginx/snippets/ih-admin-routes.conf
#
# Phase 15 (ADR-031): TEMPLATE for serving the Angular Admin Console at the ROOT of an
# admin-style host (the canary host first, admin.immigrationhorizons.com only after the
# human approval in docs/deployment/ANGULAR_ADMIN_CUTOVER_RUNBOOK.md).
#
#   /api/v1/*   -> Express canonical API         (127.0.0.1:4000)   /api/v1/admin/* lives here
#   /admin/*    -> Express/EJS admin CMS         (127.0.0.1:4000)   the emergency + rollback path
#   /uploads/*  -> Express public media           (blog covers are embedded by the public site)
#   /css/*, /images/*  -> Express static           (assets of the EJS pages)
#   everything else -> Angular static files of the ACTIVE release (static/admin-console/)
#
# Nothing applies this file: deploy.sh never touches nginx. Like the staff snippet it is an
# INCLUDE, so certbot's TLS server block is never replaced. ONE line inside the HTTPS
# `server { }` block, replacing the existing `location / { ... }`:
#
#     include /etc/nginx/snippets/ih-admin-routes.conf;
#
# Rollback is putting the backed-up server block back, `nginx -t`, reload.
#
# Rules this file keeps on purpose (same as ih-app-staff-routes.conf):
#   * `expires` (not add_header) sets cache headers, so the server-level security headers
#     (X-Robots-Tag noindex, X-Frame-Options, ...) are still inherited here.
#   * No permanent redirects and no CORS: the browser talks to /api/v1/admin on its own origin.
#   * Prefix locations use ^~ so the static-asset regex below can never steal an Express path.

location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;   # CSV exports and large media uploads
}

# The EJS CMS stays reachable at /admin whatever happens to the Angular app.
location = /admin { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
}

# Uploaded media and the EJS pages' own assets are served by Express from server/public.
location ^~ /uploads/ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /css/     { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /images/  { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

# Real files only: a missing hashed bundle is a 404, NOT index.html, so a bad deploy is
# visible instead of hiding behind the SPA fallback.
location ~ ^/.+\.(?:js|mjs|css|map|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|txt|json|webmanifest)$ {
    root /srv/immigration-horizons/current/static/admin-console;
    try_files $uri =404;
    expires 1y;               # filenames are content-hashed (outputHashing: all)
}

# Everything else is an Angular route: refresh and deep links fall back to the shell of the
# active release. The shell is never cached so a new release is picked up immediately.
location / {
    root /srv/immigration-horizons/current/static/admin-console;
    try_files $uri /index.html;
    expires -1;
}
