# /etc/nginx/sites-available/app.immigrationhorizons.com
#
# Client portal + staff. Release Gate 01 (ADR-024) made this route-aware:
#
#   /api/v1/*   -> Express canonical staff API   :4000   (snippet)
#   /staff/*    -> Angular case-management        static  (snippet)
#   everything else -> Next.js                    :3000   (below)
#
# One Next.js process still serves the marketing site AND the portal, separated by
# host in src/proxy.ts (ADR-008). The host header is therefore load-bearing:
# proxy_set_header Host $host is what makes that split work.
#
# THIS FILE IS A TEMPLATE FOR A FRESH SERVER. On a server where certbot has already
# rewritten the live file (TLS, redirect), do NOT copy this over it — add the single
# `include` line below to the HTTPS server block instead. Procedure and rollback:
# docs/deployment/ANGULAR_STAFF_CUTOVER_RUNBOOK.md.
#
# Rollback reference (the previous, Next-only routing) is kept in
# scripts/deploy/nginx/rollback/app.immigrationhorizons.com.next-only.conf.

server {
    listen 80;
    listen [::]:80;
    server_name app.immigrationhorizons.com;

    # Document uploads. The 25M here must not be lower than the app's own
    # DOCUMENT_MAX_FILE_SIZE_BYTES, or nginx rejects a file the app would
    # have accepted and the client sees a bare 413 with no explanation.
    client_max_body_size 25M;

    # Defence in depth only — the app already sets these on every response
    # (proxy.ts). Duplicated here so a proxy misconfiguration cannot expose
    # an authenticated surface to a crawler. The routes below set cache headers
    # with `expires`, so these stay inherited.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Step B of the cutover: /api/v1 -> Express, /staff -> Angular static.
    # Remove this one line (and reload) to return staff to the legacy Next.js UI.
    include /etc/nginx/snippets/ih-app-staff-routes.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }
}
