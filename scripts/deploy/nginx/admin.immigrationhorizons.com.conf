# /etc/nginx/sites-available/admin.immigrationhorizons.com
#
# Express/EJS admin CMS — a separate process on port 4000.

server {
    listen 80;
    listen [::]:80;
    server_name admin.immigrationhorizons.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # The CMS sets `trust proxy` in production and reads these to build
        # secure cookies and to record real client IPs in security_events.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # CSV exports over large lead sets
    }

    # Media library and document uploads go through this host too.
    client_max_body_size 25M;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Optional, and worth doing once the team's addresses are stable: the
    # admin CMS never needs to be reachable from the open internet.
    # allow 203.0.113.4;   # office
    # deny  all;
}
