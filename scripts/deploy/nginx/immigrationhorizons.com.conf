# /etc/nginx/sites-available/immigrationhorizons.com
#
# Public marketing site. Install BEFORE running certbot — certbot rewrites
# these files in place to add the TLS directives, so start with port 80 only
# and let it do that.

server {
    listen 80;
    listen [::]:80;
    server_name immigrationhorizons.com www.immigrationhorizons.com;

    # Real client IPs. Without this every rate limit and every security_events
    # row records 127.0.0.1, which makes "block this attacker" impossible.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # Next.js fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
